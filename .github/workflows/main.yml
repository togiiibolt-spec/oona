name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build carrotmods
        run: gradle build --no-daemon --stacktrace

      - name: Merge into Carrot Client jar
        run: python3 tools/merge.py

      - uses: actions/upload-artifact@v4
        with:
          name: carrot-client-plus
          path: |
            build/carrot-client-26.2-plus.jar
            build/libs/carrotmods-*.jar
